[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; IRremoteESP8266 retained ONLY for optional GPIO26 optical receiver diagnostics.
lib_deps =
    crankyoldgit/IRremoteESP8266@2.9.0

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = esp32-shopshell.local
